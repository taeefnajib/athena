<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athena — AutoML Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0d12;
      --panel:     #12151e;
      --card:      #191d2b;
      --card2:     #1f2437;
      --border:    rgba(255,255,255,0.065);
      --border2:   rgba(255,255,255,0.12);
      --text:      #dde2ef;
      --text-dim:  #7b85a0;
      --text-muted:#4a5168;
      --accent:    oklch(68% 0.22 225);
      --accent-glow: oklch(68% 0.22 225 / 0.25);
      --accent2:   oklch(68% 0.22 285);
      --success:   oklch(68% 0.18 145);
      --warning:   oklch(72% 0.18 65);
      --error:     oklch(65% 0.22 25);
      --running:   oklch(68% 0.2 200);
      --shadow:    0 4px 24px rgba(0,0,0,0.45);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
      --radius:    8px;
      --radius-lg: 12px;
      --font:      'Plus Jakarta Sans', sans-serif;
      --mono:      'JetBrains Mono', monospace;

      --cat-data:       oklch(68% 0.18 190);
      --cat-quality:    oklch(68% 0.18 145);
      --cat-feature:    oklch(68% 0.18 270);
      --cat-balance:    oklch(68% 0.18 310);
      --cat-split:      oklch(68% 0.18 55);
      --cat-model:      oklch(68% 0.18 225);
      --cat-advanced:   oklch(68% 0.18 245);
      --cat-ensemble:   oklch(68% 0.18 200);
      --cat-eval:       oklch(68% 0.18 35);
      --cat-interp:     oklch(68% 0.18 320);
      --cat-deploy:     oklch(68% 0.18 15);
      --cat-monitor:    oklch(68% 0.18 170);
      --cat-cluster:    oklch(68% 0.18 290);
      --cat-forecast:   oklch(70% 0.16 100);
      --cat-subflow:    oklch(70% 0.06 260);

      /* Single-series chart marks (validated: >= 3:1 vs the panel surface in each theme) */
      --chart-mark:       oklch(66% 0.16 225);
      --chart-mark-hover: oklch(74% 0.15 225);
      --chart-grid:       rgba(255,255,255,0.08);

      /* Code editor syntax colours (CodeMirror) */
      --code-keyword:  oklch(74% 0.14 300);
      --code-string:   oklch(78% 0.13 145);
      --code-number:   oklch(80% 0.13 65);
      --code-comment:  oklch(62% 0.02 260);
      --code-function: oklch(77% 0.12 225);
      --code-selection: rgba(56,189,248,0.22);
    }

    html[data-theme="light"] {
      --bg:        #f0f2f8;
      --panel:     #ffffff;
      --card:      #f7f8fc;
      --card2:     #eef0f8;
      --border:    rgba(0,0,0,0.08);
      --border2:   rgba(0,0,0,0.14);
      --text:      #1a1d2e;
      --text-dim:  #5a6078;
      --text-muted:#9aa0b8;
      --shadow:    0 4px 24px rgba(0,0,0,0.1);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.15);
      --chart-mark:       oklch(58% 0.17 225);
      --chart-mark-hover: oklch(50% 0.17 225);
      --chart-grid:       rgba(0,0,0,0.08);
      --code-keyword:  oklch(47% 0.19 300);
      --code-string:   oklch(47% 0.13 150);
      --code-number:   oklch(52% 0.15 55);
      --code-comment:  oklch(55% 0.02 260);
      --code-function: oklch(47% 0.15 245);
      --code-selection: rgba(14,116,186,0.16);
    }

    html, body, #root {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

    .theme-transition, .theme-transition * {
      transition: background 0.25s, color 0.2s, border-color 0.2s !important;
    }

    .canvas-grid-dark {
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
    }
    html[data-theme="light"] .canvas-grid-dark {
      background-image:
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
      background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 var(--running); opacity: 1; }
      100% { box-shadow: 0 0 0 6px transparent; opacity: 0; }
    }
    .status-running { animation: pulse-ring 1.2s infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.2s ease forwards; }

    @keyframes nodePulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
      50% { box-shadow: 0 0 0 8px var(--accent-glow); }
    }
    .node-running { animation: nodePulse 1s ease-in-out infinite; }

    @keyframes flowDash {
      from { stroke-dashoffset: 20; }
      to   { stroke-dashoffset: 0; }
    }

    /* React Flow overrides */
    .react-flow__node { cursor: default; }
    .react-flow__handle {
      width: 12px !important;
      height: 12px !important;
      border-radius: 50% !important;
      background: var(--panel) !important;
      border: 2px solid var(--border2) !important;
      transition: all 0.12s !important;
    }
    .react-flow__handle:hover {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
      box-shadow: 0 0 10px var(--accent-glow) !important;
    }
    .react-flow__handle-left { left: -7px !important; }
    .react-flow__handle-right { right: -7px !important; }
    .react-flow__edge-path { stroke: var(--text-muted); stroke-width: 1.5; }
    .react-flow__edge.selected .react-flow__edge-path { stroke: var(--accent); stroke-width: 2.5; }
    .react-flow__controls { background: var(--panel) !important; border: 1px solid var(--border) !important; border-radius: 8px !important; box-shadow: var(--shadow) !important; }
    .react-flow__controls-button { background: var(--panel) !important; border-bottom: 1px solid var(--border) !important; color: var(--text-dim) !important; }
    .react-flow__controls-button:hover { background: var(--card) !important; }
    .react-flow__minimap { background: var(--panel) !important; border: 1px solid var(--border) !important; border-radius: 8px !important; }
    .react-flow__background { background-color: var(--bg) !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
