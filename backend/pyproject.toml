[project]
name = "athena-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "imbalanced-learn>=0.12.0",
    "shap>=0.46.0",
    "joblib>=1.4.0",
    "matplotlib>=3.9.0",
    "structlog>=24.4.0",
    "anyio>=4.6.0",
    "nbformat>=5.10.0",
    "websockets>=13.0",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1.0",
    "sqlalchemy>=2.0.30",
    "keyring>=25.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.1.0",
    "fsspec>=2024.6.0",
    "lightgbm>=4.3.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
mysql = ["pymysql>=1.1.0"]
duckdb = ["duckdb-engine>=0.13.0"]  # DuckDB as a SQL connector dialect (duckdb itself is a base dependency)
s3 = ["s3fs>=2024.6.0"]
gcs = ["gcsfs>=2024.6.0"]
azure = ["adlfs>=2024.4.1"]
mssql = ["pyodbc>=5.1.0"]
mlflow = ["mlflow>=3.0"]
automl = ["flaml[automl]>=2.3.0"]
catboost = ["catboost>=1.2.5"]
optuna = ["optuna>=4.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

# Athena loads nodes and connectors from these entry point groups; third-party plugins use the same ones.
[project.entry-points."athena.nodes"]
builtin = "athena.nodes"
tracking = "athena.tracking"

[project.entry-points."athena.connectors"]
builtin = "athena.connectors"

[tool.hatch.build.targets.wheel]
packages = ["athena"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
